name: Release ROCKSOUL-EX

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify, package, and publish GitHub Release
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned release tooling
        run: npm install --no-save --package-lock=false @vscode/test-electron@3.1.0 mocha@12.0.3 @vscode/vsce@4.1.0
      - name: Verify unit and syntax checks
        run: npm run check
      - name: Verify VS Code Extension Host
        run: xvfb-run -a npm run test:extension
      - name: Build VSIX
        run: npx --no-install vsce package --no-dependencies --out rocksoul-ex-${GITHUB_REF_NAME}.vsix
      - name: Publish VSIX to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: rocksoul-ex-${{ github.ref_name }}.vsix
      - name: Publish to Visual Studio Marketplace with GitHub OIDC
        if: ${{ vars.VSCE_USE_OIDC == 'true' }}
        run: npx --no-install vsce publish --oidc
      - name: Publish to Visual Studio Marketplace with PAT fallback
        if: ${{ vars.VSCE_USE_OIDC != 'true' && env.VSCE_PAT != '' }}
        run: npx --no-install vsce publish
