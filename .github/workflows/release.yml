name: Release ROCKSOUL-EX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "package.json"
      - "package-lock.json"
      - "CHANGELOG.md"
      - "docs/RELEASE-CHECKLIST.md"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify, package, and publish versioned GitHub Release
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Determine package version and check release state
        id: release_meta
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          if (pkg.version !== lock.version || pkg.version !== lock.packages?.['']?.version) {
            throw new Error('package.json and package-lock.json versions must match.');
          }
          const versionCore = pkg.version.split(/[+-]/, 1)[0];
          const versionParts = versionCore.split('.');
          if (versionParts.length !== 3 || versionParts.some((part) => part.length === 0 || [...part].some((char) => char < '0' || char > '9'))) {
            throw new Error(`Invalid semantic version: ${pkg.version}`);
          }
          const tag = `v${pkg.version}`;
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/releases/tags/${tag}`;
          const response = await fetch(url, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28'
            }
          });
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`GitHub release lookup failed with ${response.status}: ${(await response.text()).slice(0, 300)}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\ntag=${tag}\nexists=${response.status === 200}\n`);
          NODE
      - name: Install pinned release tooling
        if: steps.release_meta.outputs.exists != 'true'
        run: npm install --no-save --package-lock=false @vscode/test-electron@3.1.0 mocha@12.0.3 @vscode/vsce@4.1.0
      - name: Verify unit and syntax checks
        if: steps.release_meta.outputs.exists != 'true'
        run: npm run check
      - name: Verify VS Code Extension Host
        if: steps.release_meta.outputs.exists != 'true'
        run: xvfb-run -a npm run test:extension
      - name: Build VSIX
        if: steps.release_meta.outputs.exists != 'true'
        run: npx --no-install vsce package --no-dependencies --out rocksoul-ex-${{ steps.release_meta.outputs.version }}.vsix
      - name: Publish VSIX to GitHub Release
        if: steps.release_meta.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: rocksoul-ex-${{ steps.release_meta.outputs.version }}.vsix
      - name: Publish to Visual Studio Marketplace with GitHub OIDC
        if: ${{ steps.release_meta.outputs.exists != 'true' && vars.VSCE_USE_OIDC == 'true' }}
        run: npx --no-install vsce publish --oidc
      - name: Publish to Visual Studio Marketplace with PAT fallback
        if: ${{ steps.release_meta.outputs.exists != 'true' && vars.VSCE_USE_OIDC != 'true' && env.VSCE_PAT != '' }}
        run: npx --no-install vsce publish
      - name: Report existing GitHub Release
        if: steps.release_meta.outputs.exists == 'true'
        run: echo "Release ${{ steps.release_meta.outputs.tag }} already exists; refusing to overwrite it."
