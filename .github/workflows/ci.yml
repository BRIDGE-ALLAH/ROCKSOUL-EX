
name: Quality and VSIX

on:
  push:
    branches: [main, 'feat/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and syntax · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check

  extension-host:
    name: VS Code Extension Host smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned test tooling
        run: npm install --no-save --package-lock=false @vscode/test-electron@3.1.0 mocha@12.0.3
      - name: Run Extension Development Host
        run: xvfb-run -a npm run test:extension

  package:
    name: Build installable VSIX
    runs-on: ubuntu-latest
    needs: [unit, extension-host]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned packager
        run: npm install --no-save --package-lock=false @vscode/vsce@4.0.2
      - name: Package extension
        run: |
          mkdir -p dist
          npx --no-install vsce package --no-dependencies --out dist/rocksoul-ex.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: rocksoul-ex-vsix
          path: dist/rocksoul-ex.vsix
          if-no-files-found: error
          retention-days: 30
